name: Docker Build & Push
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. v1.203.0-1.0.3). Defaults to the release tag, then the ref name, then sha-<short>."
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      # GHCR rejects uppercase names, so ghcr.io/${{ github.repository }} fails for
      # SegoMedia/adam-rms ("repository name (SegoMedia/adam-rms) must be lowercase").
      # Resolve the lowercased image and a non-empty version once per job.
      - name: Resolve image name and version
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${{ github.event.release.tag_name }}"; fi
          if [ -z "$version" ]; then version="${{ github.ref_name }}"; fi
          case "$version" in
            ''|main|master) version="sha-$(printf '%s' "${{ github.sha }}" | cut -c1-7)" ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create Version Folder if not exists
        run: |
          test -d src/version || mkdir src/version
        shell: bash
      - name: Write Version Number
        run: |
          echo "$VERSION" > src/version/TAG.txt
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
      - name: Docker github meta
        id: docker_github_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          context: git
          labels: |
            maintainer=adam-rms
            org.opencontainers.image.source=https://github.com/adam-rms/adam-rms
            org.opencontainers.image.documentation=https://adam-rms.com/self-hosting
            org.opencontainers.image.url=https://adam-rms.com
            org.opencontainers.image.vendor="Bithell Studios Ltd."
            org.opencontainers.image.description="AdamRMS is a free, open source advanced Rental Management System for Theatre, AV & Broadcast. This image is a PHP Apache2 docker container, which exposes AdamRMS on port 80."
            org.opencontainers.image.licenses=AGPL-3.0
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.docker_github_meta.outputs.labels }}
          annotations: ${{ steps.docker_github_meta.outputs.annotations }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Resolve image name and version
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${{ github.event.release.tag_name }}"; fi
          if [ -z "$version" ]; then version="${{ github.ref_name }}"; fi
          case "$version" in
            ''|main|master) version="sha-$(printf '%s' "${{ github.sha }}" | cut -c1-7)" ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Docker github meta
        id: docker_github_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          context: workflow
          labels: |
            maintainer=adam-rms
            org.opencontainers.image.source=https://github.com/adam-rms/adam-rms
            org.opencontainers.image.documentation=https://adam-rms.com/self-hosting
            org.opencontainers.image.url=https://adam-rms.com
            org.opencontainers.image.vendor="Bithell Studios Ltd."
            org.opencontainers.image.description="AdamRMS is a free, open source advanced Rental Management System for Theatre, AV & Broadcast. This image is a PHP Apache2 docker container, which exposes AdamRMS on port 80."
            org.opencontainers.image.licenses=AGPL-3.0
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        id: create_manifest
        working-directory: /tmp/digests
        run: |
          TAG_ARGS=()
          while IFS= read -r tag; do
            TAG_ARGS+=( -t "$tag" )
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${TAG_ARGS[@]}" \
            $(printf '${{ steps.meta.outputs.image }}@sha256:%s ' *)
          DIGEST="sha256:$(docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")" --raw | sha256sum | awk '{print $1}')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
      - name: Attest Docker image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.create_manifest.outputs.digest }}
          push-to-registry: true
      - name: Trigger Deploy
        if: env.WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.POST_CONTAINER_BUILD_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.POST_CONTAINER_BUILD_WEBHOOK_TOKEN }}
        run: |
          # Wait for the new image to propagate through the registry before triggering a deploy
          sleep 10
          curl -fsS --show-error -X GET -H "Authorization: Bearer $COOLIFY_TOKEN" "$WEBHOOK_URL" || echo "Warning: Deploy webhook failed, continuing anyway"
